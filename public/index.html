<!DOCTYPE html>
<!-- ============================================================
  Citas NH — SPA (aplicación de una sola página)
  ------------------------------------------------------------
  Estructura:
    <header>  barra superior con el nombre de la app
    <main>    aquí app.js dibuja cada vista (login, descubrir…)
    <nav>     navegación inferior (solo cuando hay sesión)
  Todo el texto visible sale del diccionario i18n (js/i18n/*.js)
  usando el atributo data-i18n. NADA de texto hardcodeado.
============================================================= -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: la app usa toda la pantalla del teléfono -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Citas NH — Conoce gente en New Hampshire</title>

  <!-- ============ SEO ============ -->
  <meta name="description" content="Citas NH — la app de citas en español para New Hampshire. Conoce gente hispana en Manchester, Nashua y todo NH. Regístrate gratis." />
  <meta name="keywords" content="citas New Hampshire, conocer gente NH, dating app New Hampshire, citas en español NH, singles Manchester NH, citas Nashua NH, app de citas hispana" />
  <link rel="canonical" href="https://citas-nh.onrender.com/" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Citas NH" />
  <meta name="geo.region" content="US-NH" />
  <meta name="geo.placename" content="New Hampshire" />

  <!-- Open Graph: vista previa bonita en WhatsApp / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Citas NH" />
  <meta property="og:title" content="Citas NH — Conoce gente en New Hampshire" />
  <meta property="og:description" content="La app de citas en español para New Hampshire. Conoce gente hispana en Manchester, Nashua y todo NH. ¡Regístrate gratis!" />
  <meta property="og:url" content="https://citas-nh.onrender.com/" />
  <meta property="og:image" content="https://citas-nh.onrender.com/icons/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Logo de Citas NH" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Citas NH — Conoce gente en New Hampshire" />
  <meta name="twitter:description" content="La app de citas en español para New Hampshire. Conoce gente hispana en Manchester, Nashua y todo NH. ¡Regístrate gratis!" />
  <meta name="twitter:image" content="https://citas-nh.onrender.com/icons/icon-512.png" />

  <!-- Datos estructurados (Google) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "name": "Citas NH",
        "alternateName": "Citas NH — Dating en New Hampshire",
        "url": "https://citas-nh.onrender.com/",
        "image": "https://citas-nh.onrender.com/icons/icon-512.png",
        "applicationCategory": "Dating",
        "applicationSubCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["es", "en"],
        "description": "App de citas en español para New Hampshire. Conoce gente hispana en Manchester, Nashua y todo NH: matches, chat, videollamadas y eventos.",
        "offers": [
          {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Registro y funciones básicas gratis"
          },
          {
            "@type": "Offer",
            "price": "4.99",
            "priceCurrency": "USD",
            "description": "Citas NH Premium — suscripción mensual"
          }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1"
        }
      },
      {
        "@type": "MobileApplication",
        "name": "Citas NH",
        "url": "https://citas-nh.onrender.com/",
        "image": "https://citas-nh.onrender.com/icons/icon-512.png",
        "applicationCategory": "Dating",
        "operatingSystem": ["Android", "iOS"],
        "inLanguage": ["es", "en"],
        "description": "App de citas en español para New Hampshire, instalable como PWA. Conoce gente hispana en Manchester, Nashua y todo NH.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>

  <!-- PWA: color del tema y manifest -->
  <meta name="theme-color" content="#ff2e63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Citas NH" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Barra superior -->
  <header id="topbar">
    <span class="logo-heart" aria-hidden="true">❤</span>
    <h1 data-i18n="appName">Citas NH</h1>
  </header>

  <!-- Aquí se dibuja la vista activa -->
  <main id="app" aria-live="polite"></main>

  <!-- Navegación inferior (visible solo con sesión iniciada) -->
  <nav id="bottomnav" hidden>
    <a href="#/descubrir" data-route="descubrir"><span aria-hidden="true">🔥</span><span data-i18n="nav_discover">Descubrir</span></a>
    <a href="#/matches" data-route="matches"><span aria-hidden="true">💬</span><span data-i18n="nav_matches">Matches</span></a>
    <a href="#/perfil" data-route="perfil"><span aria-hidden="true">👤</span><span data-i18n="nav_profile">Perfil</span></a>
    <a href="#/ajustes" data-route="ajustes"><span aria-hidden="true">⚙️</span><span data-i18n="nav_settings">Ajustes</span></a>
    <a href="#/eventos" data-route="eventos"><span aria-hidden="true">🎉</span><span data-i18n="nav_events">Eventos</span></a>
    <a href="#/mapa" data-route="mapa"><span aria-hidden="true">🗺️</span><span data-i18n="nav_map">Mapa</span></a>
  </nav>

  <!-- Banner discreto: instalar la app (PWA). Solo se muestra si el
       navegador dispara el evento beforeinstallprompt. -->
  <div id="pwa-install-banner" class="pwa-banner" hidden>
    <div class="pwa-banner-text">
      <strong data-i18n="pwa_install_title">Instala Citas NH 📲</strong>
      <span data-i18n="pwa_install_desc">Acceso directo en tu pantalla, como una app normal.</span>
    </div>
    <button id="pwa-install-btn" class="pwa-banner-btn" data-i18n="pwa_install_btn">Instalar</button>
    <button id="pwa-install-later" class="pwa-banner-close" data-i18n="pwa_install_later">Ahora no</button>
  </div>

  <!-- Diccionarios de idioma (formato: window.I18N / window.I18N_EN) -->
  <script src="/js/i18n/es.js"></script>
  <script src="/js/i18n/en.js"></script>
  <!-- Lógica de la app -->
  <script src="/js/app.js"></script>
</body>
</html>
